[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-lounge"
version = "0.1.0"
description = "A.I.byss Lab Lounge — 会話ランタイム（Walking Skeleton Step 4）"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "redis[hiredis]>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
llm = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
]
llm-google = [
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
]
llm-anthropic = [
    "langchain-anthropic>=0.3",
    "python-dotenv>=1.0",
]
tts = [
    "edge-tts>=6.1",
    "mutagen>=1.47",
    "python-dotenv>=1.0",
]
stt = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]
obs = [
    "langsmith>=0.1",
    "python-dotenv>=1.0",
]
mic = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]
rag = [
    "openai>=1.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]
wake = [
    "pvporcupine>=3.0",
    "python-dotenv>=1.0",
]
vad-webrtc = [
    "webrtcvad-wheels>=2.0",
    "python-dotenv>=1.0",
]
stt-local = [
    "faster-whisper>=1.0",
    "python-dotenv>=1.0",
]
stt-sherpa = [
    "sherpa-onnx>=1.10",
    "python-dotenv>=1.0",
]
tools = [
    "fastmcp>=2.0",
    "langchain-mcp-adapters>=0.2",
    "langchain-tavily>=0.1",
    "python-dotenv>=1.0",
]
obsws = [
    "obsws-python>=1.7",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lab_lounge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
