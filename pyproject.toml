[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-lounge"
version = "0.1.0"
description = "A.I.byss Lab Lounge — 会話ランタイム（Walking Skeleton Step 4）"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lab_lounge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
